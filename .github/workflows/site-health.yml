name: Website health check

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate generated pages, sitemap and product prices
        run: python3 tools/check_site.py
      - name: Validate JavaScript syntax
        run: find . -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Check important live URLs
        run: |
          for url in \
            https://autoservicebettenduerf.lu/ \
            https://autoservicebettenduerf.lu/lb/ \
            https://autoservicebettenduerf.lu/de/ \
            https://autoservicebettenduerf.lu/fr/ \
            https://autoservicebettenduerf.lu/en/ \
            https://autoservicebettenduerf.lu/lb/location.html \
            https://autoservicebettenduerf.lu/de/location.html \
            https://autoservicebettenduerf.lu/fr/location.html \
            https://autoservicebettenduerf.lu/en/location.html \
            https://autoservicebettenduerf.lu/shop.html \
            https://autoservicebettenduerf.lu/intern/ \
            https://autoservicebettenduerf.lu/datenschutz.html \
            https://autoservicebettenduerf.lu/impressum.html \
            https://autoservicebettenduerf.lu/mietbedingungen.html \
            https://garage-admin.autoservicebettenduerf.lu/fleet/public \
            https://garage-admin.autoservicebettenduerf.lu/availability \
            https://autoservicebettenduerf.lu/sitemap.xml
          do
            curl --fail --silent --show-error --location --retry 3 --max-time 20 "$url" > /dev/null
          done
