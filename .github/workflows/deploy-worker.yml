name: Deploy admin worker

on:
  push:
    branches: [main]
    paths:
      - "worker/admin-api.js"
      - "worker/admin-wrangler.toml"
      - "worker/admin-schema.json"
      - "tools/prepare_admin_schema.js"
      - "tools/d1_cli.js"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

# Serialize schema changes with catalog imports; never cancel an active import.
concurrency:
  group: garage-d1-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false wrangler@4.149.0
      - name: Apply only missing admin schema definitions
        run: node tools/prepare_admin_schema.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy worker without catalog import
        run: node node_modules/wrangler/bin/wrangler.js deploy -c worker/admin-wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
