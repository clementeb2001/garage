name: D1 write regression checks

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "tools/**"
      - "tests/**"
      - "intern/**"
      - "shop-catalog-api.js"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test with mocks and two local synthetic products; no remote database access
        run: |
          node tests/d1-write-budget.test.js
          node tests/calendar.test.js
          python3 tests/d1-sql.test.py
      - name: Validate all JavaScript syntax
        run: |
          find worker tools tests intern -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check appt-calendar.js
          node --check extras.js
