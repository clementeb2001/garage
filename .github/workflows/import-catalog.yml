name: Import changed shop catalog

on:
  push:
    branches: [main]
    paths:
      - "shop-data.js"
      - "shop-data-dba.js"
      - "worker/catalog-schema.sql"
      - "tools/build_catalog_d1.js"
      - "tools/import_catalog_d1.js"
      - "tools/d1_cli.js"
      - ".github/workflows/import-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garage-d1-production
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false wrangler@4.149.0
      - name: Build and validate catalog
        run: node tools/build_catalog_d1.js worker/catalog-seed.sql
      - name: Ensure catalog tables exist
        run: node node_modules/wrangler/bin/wrangler.js d1 execute garage-admin --remote -c worker/admin-wrangler.toml --file worker/catalog-schema.sql
      - name: Skip unchanged catalog or import and verify before activation
        run: node tools/import_catalog_d1.js worker/catalog-seed.sql
