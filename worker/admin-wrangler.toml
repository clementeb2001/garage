# Cloudflare Worker fir d'Interne Verwaltung (Reservatiounen + Memberen).
# Deploy:  wrangler deploy -c worker/admin-wrangler.toml
# Secret:  wrangler secret put SESSION_SECRET -c worker/admin-wrangler.toml
name = "garage-admin"
main = "admin-api.js"
compatibility_date = "2025-09-01"

routes = [
  { pattern = "garage-admin.autoservicebettenduerf.lu", custom_domain = true }
]

[vars]
ALLOW_ORIGIN = "https://autoservicebettenduerf.lu"
MAIL_FROM = "Autoservice Bettenduerf <noreply@autoservicebettenduerf.lu>"

# D1-Datebank (scho ugeluecht)
[[d1_databases]]
binding = "DB"
database_name = "garage-admin"
database_id = "14fccce6-50bf-4dd7-9d76-e8576c47ce2a"

# Gefier- an Dokumentatiounsfotoen
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "garage-media"

# Deeglecht Backup vun der D1-Datebank op R2 (03:17 UTC).
[triggers]
crons = ["17 3 * * *"]


# Native Workers counters: rejected traffic does not write to D1.
# Workers limits are approximate and enforced per Cloudflare location.
[[ratelimits]]
name = "PUBLIC_REQUEST_LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

[[ratelimits]]
name = "PUBLIC_GLOBAL_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
